<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>师范生教学能力训练系统</title>
    <link rel="stylesheet" href="/static/common.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .welcome-container {
            text-align: center;
            color: white;
        }

        .welcome-container h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: fadeInDown 0.8s ease;
        }

        .welcome-container p {
            font-size: 1.3rem;
            margin-bottom: 40px;
            opacity: 0.95;
            animation: fadeInUp 0.8s ease;
        }

        .welcome-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            animation: fadeIn 1s ease 0.3s backwards;
        }

        .welcome-btn {
            padding: 18px 50px;
            font-size: 1.2rem;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .welcome-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .welcome-btn.secondary {
            background: transparent;
            border: 2px solid white;
            color: white;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="welcome-container">
        <h1>🎓 师范生教学能力训练系统</h1>
        <p>基于AI技术的教学视频智能分析平台</p>
        <div class="welcome-buttons">
            <a href="/login.html" class="welcome-btn">登录</a>
            <a href="/register.html" class="welcome-btn secondary">注册</a>
        </div>
    </div>



</body>

</html>
